<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document Studio</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='5' y='3' width='22' height='26' rx='3' fill='none' stroke='%233a5bd9' stroke-width='2.5'/><path d='M13 10c-2 0-2 1-2 3s-1 3-2 3c1 0 2 1 2 3s0 3 2 3M19 10c2 0 2 1 2 3s1 3 2 3c-1 0-2 1-2 3s0 3-2 3' stroke='%233a5bd9' stroke-width='2' fill='none'/></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script>
      // Paint the saved theme and language before the app bundle loads, so the first frame is never white.
      (function () {
        var root = document.documentElement;
        var boot = {};
        var locale = 'es';
        try {
          boot = JSON.parse(localStorage.getItem('document-studio:boot') || '{}') || {};
          var prefs = JSON.parse(localStorage.getItem('document-studio:preferences') || '{}');
          if (prefs && prefs.state && /^(es|en|fr|pt)$/.test(prefs.state.locale)) locale = prefs.state.locale;
        } catch (e) {}
        var colors = { bg: '--c-bg', surface: '--c-surface', fg: '--c-fg', muted: '--c-muted', border: '--c-border', accent: '--c-accent' };
        for (var key in colors) if (boot && typeof boot[key] === 'string') root.style.setProperty(colors[key], boot[key]);
        root.style.colorScheme = boot && boot.dark ? 'dark' : 'light';
        root.lang = locale;
        window.__dsLoadingLabel = {
          es: 'Cargando Document Studio',
          en: 'Loading Document Studio',
          fr: 'Chargement de Document Studio',
          pt: 'Carregando o Document Studio',
        }[locale];
      })();
    </script>
    <style>
      html, body, #root { margin: 0; height: 100%; }
      html, body { background: var(--c-bg, #f6f7f9); color: var(--c-fg, #1c2230); }
      .boot { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      .boot svg { width: 240px; height: auto; overflow: visible; }
      .boot .card { fill: var(--c-surface, #fff); stroke: var(--c-border, #d9dde5); stroke-width: 2; }
      .boot .brace { fill: none; stroke: var(--c-accent, #3a5bd9); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .boot .key { fill: var(--c-accent, #3a5bd9); }
      .boot .line { fill: var(--c-muted, #5b6475); opacity: 0; animation: boot-line 1.6s ease-out infinite; }
      .boot .l2 { animation-delay: 0.12s; } .boot .l3 { animation-delay: 0.24s; } .boot .l4 { animation-delay: 0.36s; }
      .boot .l5 { animation-delay: 0.48s; } .boot .l6 { animation-delay: 0.6s; }
      .boot .ref { fill: none; stroke: var(--c-accent, #3a5bd9); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
        stroke-dasharray: 70; stroke-dashoffset: 70; animation: boot-draw 1.6s ease-in-out infinite; }
      .boot .target { animation: boot-in 1.6s ease-out infinite; }
      .boot .name { font-weight: 700; letter-spacing: -0.01em; font-size: 17px; }
      @keyframes boot-line { 0% { opacity: 0; transform: translateX(-4px); } 25%, 85% { opacity: 0.45; transform: none; } 100% { opacity: 0; } }
      @keyframes boot-draw { 0%, 35% { stroke-dashoffset: 70; } 70%, 90% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 0; opacity: 0; } }
      @keyframes boot-in { 0%, 45% { opacity: 0.35; } 70%, 100% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .boot * { animation: none !important; }
        .boot .line { opacity: 0.45; }
        .boot .ref { stroke-dashoffset: 0; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Shown until React renders: a JSON document filling in, with a nested subdocument and a reference to another document. -->
      <div class="boot" role="status" id="boot">
        <svg viewBox="0 0 240 112" aria-hidden="true">
          <rect class="card" x="2" y="2" width="132" height="108" rx="8" />
          <path class="brace" d="M20 14 c-5 0 -6 2 -6 6 v12 c0 3 -2 5 -4 5 c2 0 4 2 4 5 v52 c0 4 1 6 6 6" />
          <path class="brace" d="M116 14 c5 0 6 2 6 6 v12 c0 3 2 5 4 5 c-2 0 -4 2 -4 5 v52 c0 4 -1 6 -6 6" />
          <rect class="line l1" x="26" y="18" width="14" height="6" rx="3" />
          <rect class="line l1" x="44" y="18" width="40" height="6" rx="3" />
          <rect class="line l2" x="26" y="32" width="22" height="6" rx="3" />
          <rect class="line l2" x="52" y="32" width="30" height="6" rx="3" />
          <rect class="line l3" x="26" y="46" width="26" height="6" rx="3" />
          <!-- nested subdocument, one level in -->
          <path class="brace" d="M60 44 c-3 0 -4 1 -4 3 v28 c0 2 1 3 4 3" />
          <path class="brace" d="M104 44 c3 0 4 1 4 3 v28 c0 2 -1 3 -4 3" />
          <rect class="line l4" x="64" y="52" width="16" height="6" rx="3" />
          <rect class="line l4" x="84" y="52" width="16" height="6" rx="3" />
          <rect class="line l5" x="64" y="64" width="22" height="6" rx="3" />
          <rect class="line l6" x="26" y="88" width="20" height="6" rx="3" />
          <rect class="key" x="50" y="88" width="26" height="6" rx="3" />
          <!-- reference by _id to the second document -->
          <path class="ref" d="M80 91 H150 M150 91 L144 86 M150 91 L144 96" />
          <g class="target">
            <rect class="card" x="156" y="66" width="82" height="44" rx="8" />
            <rect class="key" x="168" y="78" width="22" height="6" rx="3" />
            <rect class="line l1" x="194" y="78" width="32" height="6" rx="3" style="opacity:0.45;animation:none" />
            <rect class="line l1" x="168" y="92" width="44" height="6" rx="3" style="opacity:0.45;animation:none" />
          </g>
        </svg>
        <span class="name">Document Studio</span>
      </div>
      <script>
        document.getElementById('boot').setAttribute('aria-label', window.__dsLoadingLabel || 'Cargando Document Studio');
      </script>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
